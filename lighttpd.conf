server.modules = ( "mod_access" )

server.document-root = "/var/www/"

server.port = 80

server.username = "lighttpd"
server.groupname = "lighttpd"

mimetype.assign = (
  ".html" => "text/html",
  ".htm" => "text/html",
  ".txt" => "text/plain",
  ".jpg" => "image/jpeg",
  ".png" => "image/png"
)

include "mod_fastcgi.conf"

static-file.exclude-extensions = ( ".fcgi", ".php", ".rb", "~", ".inc" )
index-file.names = ( "index.html", "index.htm" , "index.php")

# Deny access to dotfiles/dot-directories (e.g. .git, .env) in case the
# mounted document root is broader than intended.
$HTTP["url"] =~ "(^|/)\." {
  url.access-deny = ("")
}
